# Live mode: edit files in /mnt/cache/appdata/danandmarc (or push to GitHub) and the site
# rebuilds itself in a few seconds. No image builds, no redeploys.
#
#   builder  watches the folder, pulls from GitHub every 60s, rebuilds into ./dist
#   web      nginx serving ./dist
services:
  danandmarc-builder:
    image: node:22-alpine
    container_name: danandmarc-builder
    restart: unless-stopped
    working_dir: /site
    command: sh deploy/live-build.sh
    environment:
      - GIT_PULL_INTERVAL=60   # seconds; 0 = only rebuild on local edits
    volumes:
      - /mnt/cache/appdata/danandmarc:/site

  danandmarc:
    image: nginx:1.29-alpine
    container_name: danandmarc
    restart: unless-stopped
    ports:
      - "8484:80"
    volumes:
      - /mnt/cache/appdata/danandmarc/dist:/usr/share/nginx/html:ro
      - /mnt/cache/appdata/danandmarc/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/cache/appdata/danandmarc-media:/usr/share/nginx/media:ro
