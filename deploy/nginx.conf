# Static Astro build. Sits behind your reverse proxy (NPM / SWAG / Traefik / Caddy), which handles TLS.
map $uri $legacy_redirect {
    # Old Squarespace URLs -> new paths (301)
    /work                                   /;
    /work/gillerprize                       /work/who-are-you-reading;
    /work/theunignorabletower               /work/the-unignorable-tower;
    /work/js                                /work/john-st-minecraft-edition;
    /work/doordash                          /work/welcome-to-the-flavourhood;
    /work/searchhistory                     /work/search-history;
    /work/bpwishlist                        /work/the-bp-wish-list;
    /work/unignorable-29ejk                 /work/top-comic;
    /work/loblaws                           /work/if-youre-cooking-youre-a-cook;
    /work/strategyjunior                    /work/strategy-junior;
    /work/unignorable-29ejk-rhmpk           /work/marc-before-dan-and-marc;
    /work/unignorable-29ejk-rhmpk-lbrs9     /work/dan-before-marc-and-dan;
    /contact-1                              /awards;
    /contact-2                              /contact;
    /contact-1-1                            /awards;
    /contact-3                              /work/who-are-you-reading;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    if ($legacy_redirect) { return 301 $legacy_redirect; }

    # Hashed build assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Self-hosted video + posters, mounted from /mnt/cache/appdata/danandmarc-media.
    # nginx handles byte-range requests, so scrubbing/seeking works.
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        sendfile on;
        tcp_nopush on;
    }

    # Strip trailing slashes (site uses /work/foo, not /work/foo/)
    rewrite ^(/.+)/$ $1 permanent;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";   # always revalidate HTML so edits show immediately
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /404.html;
}
