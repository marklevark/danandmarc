services:
  danandmarc:
    build: .
    image: danandmarc:latest
    container_name: danandmarc
    restart: unless-stopped
    ports:
      # Host port defaults to 8484; override with DM_PORT=xxxx in .env or the shell
      - "${DM_PORT:-8484}:80"
    volumes:
      - /mnt/cache/appdata/danandmarc-media:/usr/share/nginx/media:ro
