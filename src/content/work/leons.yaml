blocks:
- heading: Get Move-Worthy
  level: 2
- text: |-
    Every year on July 1st, Montreal celebrates Moving Day - an odd phenomenon where thousands of apartment dwellers move to new apartments. As a result, unwanted furniture that’s just not worth the move gets kicked to the curb.

    So we used this opportunity to remind Montrealers that Leon’s has furniture that’s always worth the move. And turned discarded furniture into discounts for Leon’s.
