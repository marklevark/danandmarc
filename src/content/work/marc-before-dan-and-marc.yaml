- heading: The Tims Next Door
  level: 2
- credits:
    agency: Taxi
    client: Tim Hortons
- text: |-
    For every Canadian city that’s not Toronto, the local Tims is the neighbourhood hub.

    To remind Canadians of exactly that, we turned a regular ol’ house into a Tim Hortons overnight, and gave a Calgary neighbourhood (and a couple who were getting possession of the house 6 days later) a big surprise.
