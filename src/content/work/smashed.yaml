blocks:
- text: |-
    A&W was the first quick-service restaurant in Canada to launch a Smash Burger. But we had a problem: our marketing budget was much smaller than the competitors’.

    So we turned the launch campaign into an embodiment of the burger itself, by smashing everything. And we mean everything. An entire A&W restaurant (and everything in it), our commercials, OOH, social posts, and more.

    +13.5 sales growth. 26M earned impressions.
