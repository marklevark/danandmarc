blocks:
- text: |-
    Behind all of Toronto’s recent successes (Drake, Raptors Championship, etc...) you’ll find the poverty capital of Canada, currently in the midst of a housing crisis. In fact, 1 in 7 Torontonians struggle with this issue. And the waitlist for affordable housing is at 100,000+ families and counting.

    We needed to bring attention to the size and scale of this issue in a way that everyone could understand. So we visualized the problem by showing how big a building would have to be to house everyone in the city that desperately needs a home.

    And as a result, we created what would easily be the world’s biggest tower.
