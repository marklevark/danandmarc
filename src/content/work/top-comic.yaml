- heading: 'Year 4: Humour Analysis Helmet Apparatus'
  level: 3
- text: |-
    Electroencephalography (or EEG for short) is a terrifying monitoring technology that tracks your brain activity in real time, scanning what you react to whether you know you’re reacting or not.

    Also, the perfect technology to prove that the Top Comic comedians will make you laugh (even if you’re laughing on the inside).

    It’s called science! (Actually, it’s called H.A.H.A.)
