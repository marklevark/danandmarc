- heading: 'Year 2: Dick’s Pizza'
  level: 3
- text: |-
    What happens when a failed comedian (with an incredibly juvenile sense of humour) decides to open their own business. Say, a pizzeria. And let’s just say that they take this “jokes on you” mentality to the nth degree and entirely disregard any sense of a viable business plan.

    Introducing Dick’s Pizza - the fake pizzeria that really opened in Toronto that tricked people into voting for a Top Comic.

    We made the front page of reddit, were featured on PornHub’s insta, and other highlights that aren’t as good.
