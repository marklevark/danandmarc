- heading: 'Year 5: Get a Funnier Perspective'
  level: 3
- text: |-
    Anything can be funny. Yes, even a fedora - widely considered to be the worst hat of all.

    This year, we used minimalist illustrations to show that if we all had the knack for seeing the funnier side of everything, like our Top Comics do, then we’d all lead better, more humour-filled lives.
