- heading: 'Year 3: KEITH'
  level: 3
- text: |-
    Slowly but surely, the robots are taking over. Not like “taking over” taking over, but like “doing our jobs”. I mean, grocery stores have us cashing ourselves out. Ourselves!

    But one thing’s for sure, robots will never be able to automate the humour, creativity, and timing of a Top Comic.

    They’re the future of comedy. And we proved it by making the world’s first automated stand-up comedian. His name is Keith, and he sucks.
