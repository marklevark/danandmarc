blocks:
- text: |-
    Every year, stand-up comedians from across the country fight for the most laughs in SiriusXM’s Top Comic competition.

    And for the last 5 years, we’ve been tasked at creating a new campaign that outperforms the last.

    We made the cover of Archive magazine, got re-posted by Pornhub, and had a room full of Cannes judges deliberating on a photo of a dog that’s been shaved to look like it’s having sex with itself.
- images:
  - src: ../../assets/work/top-comic/top-comic-intro_2--1-.png
- heading: 'Year 1: Help a Comedian'
  level: 3
- text: |-
    Comedians have this incredibly ability to turn anything into a joke. Meaning they could turn any career into a joke. Meaning we should support them to prevent this from happening.

    This was our first campaign for Top Comic and the only time we’ve shaved a dog to look like it’s having sex with itself.
