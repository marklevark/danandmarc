- heading: The Ignored Room
  level: 4
- text: As part of Toronto’s Nuit Blanche, we created an interactive installation to emulate the feelings of isolation, helplessness, and uncertainty that millions of Canadians feel every day. Its ominous (and heavily instagrammable) presence was unignorable, with people waiting over an hour to get in.
